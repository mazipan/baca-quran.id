<!doctype html>
<html lang="en" class="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/images/icon-32.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				var VALID_THEMES = ['light', 'dark', 'forest', 'halloween', 'fall', 'pinky', 'violet', 'pastel', 'neon'];
				window.__theme = 'light';

				function setProperTheme(newTheme) {
					newTheme = newTheme || 'light';
					window.__theme = newTheme;
					document.querySelector('html').setAttribute('class', newTheme);

					try {
						localStorage.setItem('theme', newTheme);
					} catch (err) {}
				}

				function setTheme(newTheme) {
					if (newTheme && newTheme !== 'null') {
						setProperTheme(newTheme);
					} else {
						setProperTheme('light');
					}
				}

				window.__setActiveTheme = setTheme;

				var resolvedTheme = null;

				try {
					var urlTheme = new URLSearchParams(window.location.search).get('theme');
					if (urlTheme && VALID_THEMES.indexOf(urlTheme) !== -1) {
						resolvedTheme = urlTheme;
					}
				} catch (err) {}

				if (!resolvedTheme) {
					try {
						var stored = localStorage.getItem('theme');
						if (stored && stored !== 'null') {
							resolvedTheme = stored;
						}
					} catch (err) {}
				}

				setTheme(resolvedTheme || 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" id="body" class="bg-primary text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
